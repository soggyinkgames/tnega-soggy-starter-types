# task.yml
version: 1
id: "tool-catalog-v1"
title: "Build canonical tool catalog"

objective: >
  Create a canonical tool catalog with stable ids, controlled categories,
  and deterministic resolution.

domain:
  area: "tooling"
  capability: "tool-definition-and-resolution"

summary: >
  This task defines the canonical representation of tools and the rules
  for resolving them by id and category for use across the starter.

inputs:
  - name: "tool_id"
    kind: "string"
    required: true
    description: "Canonical identifier for a tool"
    rules:
      - "must match a registered tool id"
      - "must be stable once published"

  - name: "tool_category"
    kind: "enum"
    required: true
    description: "Controlled category assigned to a tool"
    rules:
      - "must come from the controlled category set"
      - "must not be inferred dynamically"

outputs:
  - name: "tool_definition"
    kind: "object"
    required: true
    description: "Resolved canonical tool metadata"
    rules:
      - "must contain stable id"
      - "must contain valid category"
      - "must be resolvable deterministically"

  - name: "resolved_tool_collection"
    kind: "list"
    required: true
    description: "Deterministically resolved collection of tool definitions"
    rules:
      - "must preserve deterministic ordering"
      - "must not contain duplicate tool ids"

behavior:
  required:
    - "resolve known tool definitions by id"
    - "reject unknown tool ids explicitly"
    - "preserve deterministic ordering when resolving multiple tools"
    - "prevent duplicate tool ids in the canonical catalog"
    - "enforce controlled category values for all tool definitions"
  forbidden:
    - "do not silently alias invalid or unknown tool ids"
    - "do not use free-form uncontrolled category values"
    - "do not infer categories dynamically at resolution time"
    - "do not return ambiguous matches for a requested tool id"

invariants:
  - "tool ids are unique"
  - "tool categories are controlled values"
  - "tool resolution is deterministic"
  - "canonical tool definitions remain the source of truth"

scope:
  include:
    - "tool definition model"
    - "tool registry or catalog"
    - "tool resolver behavior"
    - "tool category control rules"
  exclude:
    - "cli prompts"
    - "orchestration redesign"
    - "eval package changes"
    - "agent runtime redesign"
    - "memory system changes"

non_goals:
  - "do not add interactive cli behavior"
  - "do not redesign orchestration contracts"
  - "do not introduce dependency discovery through runtime prompts or dynamic imports"
  - "do not refactor unrelated subsystems"

acceptance:
  - "a canonical catalog exists for supported tools"
  - "unknown tool ids are rejected explicitly"
  - "tool categories are validated against a controlled set"
  - "resolution behavior is deterministic for single and multiple tool lookups"
  - "duplicate tool ids cannot exist in accepted tool definitions"

failure_conditions:
  - "tool ids resolve ambiguously"
  - "unknown tool ids are accepted silently"
  - "categories are free-form without control"
  - "resolution order changes nondeterministically"
  - "duplicate tool ids are possible in the accepted catalog"

notes:
  - "This task is stack-agnostic and should remain valid if the implementation moves from TypeScript to another language"
  - "File paths, commands, and repo-specific edit scope belong in patch.yml and verify.yml"