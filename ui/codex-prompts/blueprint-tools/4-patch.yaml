# patch.yml
version: 1
id: "tool-catalog-v1-patch"
task_ref: "tool-catalog-v1"
stack_ref: "ts-node-vitest"
rules_ref: "tooling-global-rules-v1"

summary: >
  Implement the canonical tooling contract in the current TypeScript Node repo
  by defining controlled tool categories, a canonical tool catalog, deterministic
  resolution behavior, and directly related tests.

scope:
  allow_edit:
    - "src/tools/**"
    - "tests/tools/**"
  deny_edit:
    - "src/agents/**"
    - "src/orchestrations/**"
    - "src/evals/**"
    - "src/memory/**"
    - "scripts/**"
    - "templates/**"
    - "package.json"

preconditions:
  - "The repo already contains a src/tools area or an agreed location for tooling source files"
  - "The repo already contains a tests directory or an agreed location for tooling tests"
  - "The active task contract is tool-catalog-v1"
  - "The active stack profile is ts-node-vitest"

plan:
  - file: "src/tools/types.ts"
    action: "create_or_update"
    purpose: "Define the canonical tool definition shape and controlled category type"
    linked_acceptance:
      - "tool categories are validated against a controlled set"
      - "duplicate tool ids cannot exist in accepted tool definitions"

  - file: "src/tools/catalog.ts"
    action: "create_or_update"
    purpose: "Define the canonical catalog of tool definitions as the source of truth"
    linked_acceptance:
      - "a canonical catalog exists for supported tools"
      - "duplicate tool ids cannot exist in accepted tool definitions"

  - file: "src/tools/resolve_tools.ts"
    action: "create_or_update"
    purpose: "Implement deterministic tool resolution by id"
    linked_acceptance:
      - "unknown tool ids are rejected explicitly"
      - "resolution behavior is deterministic for single and multiple tool lookups"

  - file: "tests/tools/catalog.test.ts"
    action: "create_or_update"
    purpose: "Verify catalog integrity including uniqueness and valid categories"
    linked_acceptance:
      - "tool categories are validated against a controlled set"
      - "duplicate tool ids cannot exist in accepted tool definitions"

  - file: "tests/tools/resolve_tools.test.ts"
    action: "create_or_update"
    purpose: "Verify deterministic resolver behavior and explicit failure for unknown ids"
    linked_acceptance:
      - "unknown tool ids are rejected explicitly"
      - "resolution behavior is deterministic for single and multiple tool lookups"

implementation_notes:
  - "Use static imports only"
  - "Do not add prompt-driven behavior"
  - "Do not add runtime discovery through dynamic imports"
  - "Keep tool ids stable and explicit"
  - "Use the smallest correct diff required to satisfy the task contract"

risks:
  - "Existing tooling files may already encode uncontrolled categories and need normalization"
  - "Current resolver naming may differ from the task contract and require adaptation without broad refactor"
  - "Tests may need to establish deterministic ordering explicitly if current implementation relies on object iteration"

stop_conditions:
  - "Stop if the current repo does not have an agreed canonical location for tooling source files"
  - "Stop if tool ids are already used inconsistently across unrelated subsystems and changing them would violate scope"
  - "Stop if required behavior depends on redesigning orchestration, agents, or CLI systems"
  - "Stop if satisfying the task would require adding dependencies"

postconditions:
  - "Canonical tool definitions exist as the source of truth"
  - "Tool categories are controlled and validated"
  - "Resolver behavior is deterministic"
  - "Unknown tool ids fail explicitly"
  - "Directly related tests cover catalog integrity and resolver behavior"