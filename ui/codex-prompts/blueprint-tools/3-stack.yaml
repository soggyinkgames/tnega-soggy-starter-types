# stack.yml
version: 1
id: "ts-node-vitest"
title: "TypeScript Node stack for the agent starter"

stack:
  language: "typescript"
  runtime: "node"
  module_system: "esm"
  typing: "static"
  config_style: "ts"
  test_framework: "vitest"
  linter: "eslint"
  formatter: "prettier"
  package_manager: "npm"

repo:
  source_root: "src"
  test_root: "tests"
  scripts_root: "scripts"
  path_style: "alias-based"
  import_policy: "static-only"
  naming:
    files: "kebab-case"
    symbols: "camelCase"

implementation_defaults:
  error_strategy: "throw"
  generation_style: "manual-assembly"
  dependency_policy: "no-new-deps-by-default"
  test_policy: "add-tests-for-all-changes"

commands:
  install: "npm install"
  typecheck: "npm run typecheck"
  test: "npm run test"
  lint: "npm run lint"
  format: "npm run format"

notes:
  - "This stack profile is repo-specific and can be swapped without changing task.yml"
  - "If the project later moves to another stack such as Python, only stack.yml, patch.yml, and verify.yml should need to change"