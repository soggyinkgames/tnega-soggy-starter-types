# rules.yml
version: 1
id: "<ruleset-id>"
title: "<short-human-title>"

purpose: >
  <permanent engineering rules that apply across tasks>

applies_to:
  tasks:
    - "<task-id-or-*>"
  stacks:
    - "<stack-id-or-*>"

rules:
  scope:
    - "<edit boundary rule>"
    - "<scope control rule>"

  architecture:
    - "<architecture preservation rule>"
    - "<public contract rule>"

  dependencies:
    - "<dependency policy>"
    - "<runtime/tooling policy>"

  behavior:
    - "<determinism rule>"
    - "<failure handling rule>"
    - "<minimal diff rule>"

  testing:
    - "<test expectation rule>"
    - "<regression protection rule>"

  safety:
    - "<destructive change rule>"
    - "<data/config protection rule>"

forbidden:
  - "<explicitly forbidden action>"
  - "<explicitly forbidden action>"

review_gates:
  - "<condition that must be true before approval>"
  - "<condition that must be true before approval>"

notes:
  - "<optional clarification>"