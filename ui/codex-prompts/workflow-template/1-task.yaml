#task.yml
version: 1
id: "<task-id>"
title: "<short-human-title>"

objective: >
  <single concrete outcome this task must achieve>

domain:
  area: "<tooling|evals|orchestration|memory|cli|agent-type|shared>"
  capability: "<specific capability name>"

summary: >
  <1-3 sentence plain description of what this task is for>

inputs:
  - name: "<input-name>"
    kind: "<string|number|boolean|list|object|enum>"
    required: true
    description: "<what this input represents>"
    rules:
      - "<validation or domain rule>"
      - "<validation or domain rule>"

outputs:
  - name: "<output-name>"
    kind: "<string|number|boolean|list|object|enum>"
    required: true
    description: "<what this output represents>"
    rules:
      - "<output rule>"
      - "<output rule>"

behavior:
  required:
    - "<required behavior>"
    - "<required behavior>"
  forbidden:
    - "<forbidden behavior>"
    - "<forbidden behavior>"

invariants:
  - "<must remain true before and after implementation>"
  - "<must remain true before and after implementation>"

scope:
  include:
    - "<concept, subsystem, or bounded concern included in this task>"
    - "<concept, subsystem, or bounded concern included in this task>"
  exclude:
    - "<concept, subsystem, or concern explicitly excluded>"
    - "<concept, subsystem, or concern explicitly excluded>"

non_goals:
  - "<work that must not be attempted>"
  - "<work that must not be attempted>"

acceptance:
  - "<observable condition proving success>"
  - "<observable condition proving success>"
  - "<observable condition proving success>"

failure_conditions:
  - "<condition that means the task is not acceptable>"
  - "<condition that means the task is not acceptable>"

notes:
  - "<optional domain clarification>"
  - "<optional domain clarification>"