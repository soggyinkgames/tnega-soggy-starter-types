name: codex-new-agent-and-orch-goals
description: >
  Update new-agent flow (agent → orchestration → framework → goals) and add
  goals.ts to every orchestration under /packages/orch-*. Existing index.ts are preserved.

tasks:
  # --- 1) Update the CLI to show goals with examples *after* choosing orchestration ---
  - title: Update scripts/new-agent.ts to include goal/outcome/examples selection
    files:
      - path: scripts/new-agent.ts
        action: replace
        content: |
          import fs from "fs-extra";
          import path from "path";
          import inquirer from "inquirer";

          const orchMap = {
            "knowledge-insight": { orch: "orch-shared-memory", framework: "langgraph" },
            "strategy": { orch: "orch-hierarchical", framework: "crewai" },
            "creative-generation": { orch: "orch-group-collaborative", framework: "crewai" },
            "personal-workflow-assistant": { orch: "orch-sequential", framework: "langchain" },
            "data-analyst-debugger": { orch: "orch-concurrent", framework: "langgraph" },
            "simulation-scenario": { orch: "orch-negotiate", framework: "crewai" },
            "educational": { orch: "orch-centralised", framework: "langchain" },
            "dev-infrastructure": { orch: "orch-hybrid-adaptive", framework: "langgraph" },
          };

          async function createNewAgent() {
            // 1) Pick agent type
            const { agentType } = await inquirer.prompt([
              { type: "list", name: "agentType", message: "Select agent type:", choices: Object.keys(orchMap) },
            ]);

            const { orch: defaultOrch } = orchMap[agentType];

            // 2) Confirm or change orchestration
            const { useDefaultOrch } = await inquirer.prompt([
              { type: "confirm", name: "useDefaultOrch", message: `Use recommended orchestration (${defaultOrch})?`, default: true },
            ]);

            let orchType = defaultOrch;
            if (!useDefaultOrch) {
              const { orchSelection } = await inquirer.prompt([
                { type: "list", name: "orchSelection", message: "Choose orchestration:", choices: Object.values(orchMap).map(o => o.orch) },
              ]);
              orchType = orchSelection;
            }

            // 3) Choose framework (after orchestration)
            const orchConfig = (await import(path.resolve("packages", orchType, "config.ts"))).default;
            let framework = orchConfig.default_tooling;
            const { useDefaultFramework } = await inquirer.prompt([
              { type: "confirm", name: "useDefaultFramework", message: `Use recommended framework (${framework})?`, default: true },
            ]);
            if (!useDefaultFramework) {
              const { fwSelection } = await inquirer.prompt([
                { type: "list", name: "fwSelection", message: "Choose from available frameworks:", choices: orchConfig.supported_framework },
              ]);
              framework = fwSelection;
            }

            // 4) Load & display goals (with outcomes + 3 examples)
            let goalData: any[] = [];
            try {
              const goalsModule = await import(path.resolve("packages", orchType, "goals.ts"));
              goalData = goalsModule.goals || [];
            } catch {
              console.warn(`⚠️ No goals.ts found for ${orchType}`);
            }

            let selectedGoal: any = null;
            if (goalData.length > 0) {
              console.log("\nAvailable goals for this orchestration:\n");
              for (const g of goalData) {
                console.log(`🧭  ${g.name}: ${g.description}`);
                console.log(`   → Outcomes: ${g.outcomes.join(", ")}`);
                console.log("   → Example uses:");
                (g.examples || []).forEach((ex: string) => console.log(`      - ${ex}`));
                console.log("");
              }

              const { goalChoice } = await inquirer.prompt([
                { type: "list", name: "goalChoice", message: "Select a goal for this agent:", choices: goalData.map(g => g.name) },
              ]);
              selectedGoal = goalData.find(g => g.name === goalChoice);
            }

            // 5) Preserve existing evals if present
            const agentDir = path.resolve("agents", agentType);
            await fs.ensureDir(agentDir);
            const existingConfigPath = path.join(agentDir, "config.ts");
            let existingEvals = ["basic"];
            if (fs.existsSync(existingConfigPath)) {
              try {
                const oldCfg = (await import(existingConfigPath)).default;
                if (oldCfg?.evals) existingEvals = oldCfg.evals;
              } catch {}
            }

            // 6) Write the new agent config
            const configText = `
            export default {
              id: "${agentType}",
              default_orch: "${orchType}",
              tooling: { framework: "${framework}" },
              goals: ${selectedGoal ? JSON.stringify([selectedGoal.name]) : "[]"},
              outcomes: ${selectedGoal ? JSON.stringify(selectedGoal.outcomes) : "[]"},
              tools_needed: ${selectedGoal ? JSON.stringify(selectedGoal.recommendedTools) : "[]"},
              evals: ${JSON.stringify(existingEvals)},
              self_build: false
            };
            `;
            await fs.writeFile(path.join(agentDir, "config.ts"), configText.trimStart(), "utf8");

            console.log(`\n✅ Created agent "${agentType}" using ${orchType} (${framework})`);
            if (selectedGoal) {
              console.log(`🎯 Goal: ${selectedGoal.name}`);
              console.log(`   Outcomes: ${selectedGoal.outcomes.join(", ")}`);
            }
          }

          createNewAgent().catch(console.error);

